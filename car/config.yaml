# ============================================================
#  全项目统一配置文件
#  修改参数后无需重启 Python 解释器，下次加载自动生效
# ============================================================

# 能够走的区域
room:
  x_min: 0.4
  x_max: 4.2
  y_min: 0.4
  y_max: 8.6
  x_offset: 0.0
  y_offset: 0.0

# 底盘通信
chassis:
  ip: "192.168.42.2"
  port: 40923
  wheel_stop_timeout: 10.0
  wheel_speed_threshold: 10.0

# Flask 服务端
server:
  host: "0.0.0.0"
  port: 5000
  move_tolerance: 0.08
  move_max_retries: 5
  long_distance_tolerance: 0.00001
  # SyncYaw: 偏角超过此阈值(度)才纠正
  sync_yaw_threshold_deg: 10.0
  sync_yaw_step_min_deg: 5
  sync_yaw_step_max_deg: 10.0
  sync_yaw_max_iterations: 6

# 客户端（pipeline 连接 Flask 的地址）
client:
  car_ip: "10.152.203.227"
  car_port: 5000
  move_timeout: 30
  step_delay: 0.3
  pos_threshold: 0.08
  max_retries: 5
  lidar_beam_timeout: 3.0
  sanity_check_tolerance: 0.5

# 障碍物检测
obstacle:
  lidar_timeout: 5.0
  jump_threshold: 0.3
  expand_jump_ratio: 2.0
  cluster_min_beams: 3
  cluster_max_gap: 10
  cross_zero_merge_margin: 5
  # 越界过滤用的房间边界（可略大于 room 边界）
  filter_x_min: 0.2
  filter_x_max: 4.7
  filter_y_min: 0.2
  filter_y_max: 8.8
  # 检测前向 gety 反方向(左)侧移距离，减少盲区，0=关闭
  blind_spot_shift: 0.3

# 路径规划
path_planning:
  obstacle_margin: 0.6
  wall_margin: 0.5
  grid_expand: 0.0
  grid_x_step: 0.1
  grid_y_step: 0.1
  cost_dist_weight: 1.0
  cost_risk_weight: 1.0
  correction_corridor_width: 0.6
  correction_min_interval: 1.0

# LiDAR 工具
lidar:
  samples: 5
